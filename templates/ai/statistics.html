{% extends "base.html" %}
{% block title %}Статистика по ключевым словам{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6">📊 Статистика по ключевым словам</h1>
    <div id="keywords-stats" class="bg-white rounded-lg shadow p-6">
        <p class="text-gray-500">Загрузка статистики...</p>
    </div>
</div>
<script>
fetch('/api/ai/keywords').then(r => r.json()).then(data => {
    if (data.success) {
        document.getElementById('keywords-stats').innerHTML = `
            <h2 class="text-xl font-bold mb-4">Всего ключевых слов: ${data.keywords.length}</h2>
            <div class="grid grid-cols-2 gap-4">
                ${data.keywords.slice(0, 20).map(kw => `
                    <div class="border p-3 rounded">
                        <strong>${kw.keyword}</strong> (${kw.category})<br>
                        Использований: ${kw.usage_count || 0}
                    </div>
                `).join('')}
            </div>
        `;
    }
});
</script>
{% endblock %}
