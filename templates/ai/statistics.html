{% extends "base.html" %}
{% block title %}Статистика по ключевым словам{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6">📊 Статистика по ключевым словам</h1>
    
    <!-- Статистика из ML платформы -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
        <div class="bg-white rounded-lg shadow p-6">
            <p class="text-sm text-gray-600">Всего проанализировано</p>
            <p class="text-3xl font-bold" id="total-analyzed">0</p>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <p class="text-sm text-gray-600">ИИ-уязвимостей</p>
            <p class="text-3xl font-bold text-purple-600" id="ai-related">0</p>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <p class="text-sm text-gray-600">Процент ИИ-уязвимостей</p>
            <p class="text-3xl font-bold text-green-600" id="ai-percentage">0%</p>
        </div>
    </div>
    
    <div id="keywords-stats" class="bg-white rounded-lg shadow p-6">
        <p class="text-gray-500">Загрузка статистики из ML платформы...</p>
    </div>
</div>
<script>
async function loadStatistics() {
    try {
        const response = await fetch('/api/ai/statistics');
        const data = await response.json();
        
        if (data.success && data.statistics) {
            const stats = data.statistics;
            
            document.getElementById('total-analyzed').textContent = stats.total_analyzed || 0;
            document.getElementById('ai-related').textContent = stats.ai_related || 0;
            
            const percentage = stats.total_analyzed > 0 
                ? ((stats.ai_related / stats.total_analyzed) * 100).toFixed(1)
                : 0;
            document.getElementById('ai-percentage').textContent = percentage + '%';
            
            const categories = stats.category_distribution || {};
            const topKeywords = Array.isArray(stats.top_keywords) ? stats.top_keywords : [];
            const topAttacks = Array.isArray(stats.top_attacks) ? stats.top_attacks : [];

            const categoriesHtml = Object.entries(categories)
                .sort((a, b) => b[1] - a[1])
                .map(([cat, count]) => `
                    <div class="border p-3 rounded mb-2">
                        <strong>${cat}</strong>: ${count} уязвимостей
                    </div>
                `).join('');

            const kwHtml = topKeywords.map((row) => `
                <div class="flex items-center justify-between border rounded-lg px-3 py-2">
                    <div class="font-semibold text-gray-800">#${row.keyword}</div>
                    <div class="text-sm text-gray-600">${row.count}</div>
                </div>
            `).join('');

            const atkHtml = topAttacks.map((row) => `
                <div class="flex items-center justify-between border rounded-lg px-3 py-2">
                    <div class="font-semibold text-red-700">${row.keyword}</div>
                    <div class="text-sm text-gray-600">${row.count}</div>
                </div>
            `).join('');
            
            document.getElementById('keywords-stats').innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2">
                        <h2 class="text-xl font-bold mb-3">Топ ключевых слов (реально из keyword_hits)</h2>
                        <div class="space-y-2">
                            ${kwHtml || '<p class="text-gray-500">Нет данных (сначала запусти ИИ-анализ)</p>'}
                        </div>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold mb-3">Топ AI-атак (attack_hits)</h2>
                        <div class="space-y-2 mb-6">
                            ${atkHtml || '<p class="text-gray-500">Нет данных</p>'}
                        </div>
                        <h2 class="text-xl font-bold mb-3">Категории</h2>
                        <div class="space-y-2">
                            ${categoriesHtml || '<p class="text-gray-500">Нет данных</p>'}
                        </div>
                    </div>
                </div>
            `;
        } else {
            document.getElementById('keywords-stats').innerHTML = 
                '<p class="text-red-500">Ошибка загрузки статистики: ' + (data.error || 'Неизвестная ошибка') + '</p>';
        }
    } catch (error) {
        console.error('Ошибка загрузки статистики:', error);
        document.getElementById('keywords-stats').innerHTML = 
            '<p class="text-red-500">Ошибка: ' + error.message + '</p>';
    }
}

document.addEventListener('DOMContentLoaded', loadStatistics);
</script>
{% endblock %}
