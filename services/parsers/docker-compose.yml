version: '3.8'

services:
  parsers:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulnerability-parsers
    environment:
      - PYTHONUNBUFFERED=1
      - CHROMIUM_PATH=/usr/bin/chromium
    volumes:
      - ./logs:/app/logs
    networks:
      - vuln_network
    restart: unless-stopped
    depends_on:
      - database

networks:
  vuln_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.88.0/24

