services:
  parsers:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulnerability-parsers
    environment:
      - PYTHONUNBUFFERED=1
      - CHROMIUM_PATH=/usr/bin/chromium
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    # Database находится на другой VM (10.0.88.11), поэтому нет зависимости

