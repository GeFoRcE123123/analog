<body>
    <div id="canvas-container">
        <div class="loading" id="loading">Загрузка 3D визуализации...</div>

            <h2>🎯 ML Platform 3D Graph</h2>
            <div class="info-body">
                <div class="stat"><strong>Узлов:</strong> <span id="node-count">0</span></div>
                <div class="stat"><strong>Связей:</strong> <span id="link-count">0</span></div>
                <div class="stat"><strong>Эпох:</strong> <span id="epoch-count">0</span></div>
                <div class="stat"><strong>FPS:</strong> <span id="fps">0</span></div>
            </div>
            <div class="panel-actions">
                <button onclick="toggleInfoPanel()">🗂 Свернуть</button>

        <div id="log-panel">

            </h3>

        </div>

        <div id="controls">
            <button onclick="resetCamera()">🔄 Сброс камеры</button>
            <button onclick="toggleAnimation()">⏸️ Пауза</button>

    <!-- Three.js Core - загрузка с детальным логированием -->
    <script>
        // Глобальная переменная для отслеживания загрузки
        window.libsLoaded = { three: false, d3: false, controls: false };
        
        // Загрузка Three.js с проверкой
        (function() {
            const scripts = [
                { src: 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', name: 'cdnjs r128' },
                { src: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/build/three.min.js', name: 'jsDelivr github' },
                { src: 'https://unpkg.com/three@0.128.0/build/three.min.js', name: 'unpkg r128' },
                { src: 'https://threejs.org/build/three.min.js', name: 'threejs.org' }
            ];
            
            let current = 0;
            function loadScript() {
                if (current >= scripts.length) {
                    const msg = '❌ Все CDN недоступны для Three.js';
                    console.error(msg);
                    addLog(msg, 'error');
                    document.getElementById('loading').textContent = msg;
                    return;
                }
                
                const script = document.createElement('script');
                script.src = scripts[current].src;
                script.onload = function() {
                    // Проверяем через небольшую задержку
                    setTimeout(() => {
                        if (typeof THREE !== 'undefined') {
                            const msg = '✅ Three.js загружен с: ' + scripts[current].name + ', версия: ' + THREE.REVISION;
                            console.log(msg);
                            addLog(msg, 'success');
                            window.libsLoaded.three = true;
                            // Загрузка OrbitControls после Three.js
                            loadOrbitControls();
                        } else {
                            console.warn('⚠️ THREE не определен после загрузки с:', scripts[current].name);
                            current++;
                            loadScript();
                        }
                    }, 100);
                };
                script.onerror = function() {
                    const msg = '⚠️ Не удалось загрузить Three.js с: ' + scripts[current].name;
                    console.warn(msg);
                    addLog(msg, 'warn');
                    current++;
                    loadScript();
                };
                document.head.appendChild(script);
            }
            
            function loadOrbitControls() {
                const controlsScripts = [
                    { src: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js', name: 'jsDelivr github' },
                    { src: 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js', name: 'cdnjs r128' },
                    { src: 'https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js', name: 'unpkg r128' }
                ];
                
                let controlsCurrent = 0;
                function tryControls() {
                    if (controlsCurrent >= controlsScripts.length) {
                        const msg = '⚠️ OrbitControls не загружен, будет использован fallback';
                        console.warn(msg);
                        addLog(msg, 'warn');
                        return;
                    }
                    
                    const script = document.createElement('script');
                    script.src = controlsScripts[controlsCurrent].src;
                    script.onload = function() {
                        const msg = '✅ OrbitControls загружен с: ' + controlsScripts[controlsCurrent].name;
                        console.log(msg);
                        addLog(msg, 'success');
                        window.libsLoaded.controls = true;
                    };
                    script.onerror = function() {
                        controlsCurrent++;
                        tryControls();
                    };
                    document.head.appendChild(script);
                }
                tryControls();
            }
            
            loadScript();
        })();
        
        // Загрузка D3.js
        (function() {
            const d3Scripts = [
                { src: 'https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js', name: 'jsDelivr' },
                { src: 'https://unpkg.com/d3@7.8.5/dist/d3.min.js', name: 'unpkg' }
            ];
            
            let current = 0;
            function loadD3() {
                if (current >= d3Scripts.length) {
                    const msg = '❌ Все CDN недоступны для D3.js';
                    console.error(msg);
                    addLog(msg, 'error');
                    return;
                }
                
                const script = document.createElement('script');
                script.src = d3Scripts[current].src;
                script.onload = function() {
                    setTimeout(() => {
                        if (typeof d3 !== 'undefined') {
                            const msg = '✅ D3.js загружен с: ' + d3Scripts[current].name + ', версия: ' + d3.version;
                            console.log(msg);
                            addLog(msg, 'success');
                            window.libsLoaded.d3 = true;
                        } else {
                            current++;
                            loadD3();
                        }
                    }, 100);
                };
                script.onerror = function() {
                    current++;
                    loadD3();
                };
                document.head.appendChild(script);
            }
            loadD3();
        })();
    </script>
    <script>
        // Проверка загрузки библиотек с задержкой для модулей
        function checkLibraries() {
            const checks = {
                'Three.js': typeof THREE !== 'undefined',
                'D3.js': typeof d3 !== 'undefined',
                'OrbitControls': typeof window.OrbitControls !== 'undefined'
            };
            
            console.log('📦 Проверка библиотек:', checks);
            
            if (!checks['Three.js']) {
                document.getElementById('loading').textContent = '❌ Ошибка: Three.js не загружен. Проверьте подключение к CDN.';
                console.error('Three.js не найден');
                return false;
            }
            
            if (!checks['D3.js']) {
                document.getElementById('loading').textContent = '❌ Ошибка: D3.js не загружен.';
                console.error('D3.js не найден');
                return false;
            }
            
            // OrbitControls fallback если не загрузился через модуль
            if (!checks['OrbitControls'] && typeof THREE !== 'undefined') {
                console.warn('⚠️ OrbitControls не найден, создаю fallback');
                window.OrbitControls = class {
                    constructor(camera, domElement) {
                        this.camera = camera;
                        this.domElement = domElement || document.body;
                        this.enableDamping = true;
                        this.dampingFactor = 0.05;
                        this.autoRotate = false;
                        this.autoRotateSpeed = 0.5;
                        this.minDistance = 100;
                        this.maxDistance = 2000;
                        this.enablePan = true;
                        this.enableZoom = true;
                        this.enableRotate = true;
                        
                        // Простая реализация управления мышью
                        let isDragging = false;
                        let previousMousePosition = { x: 0, y: 0 };
                        
                        this.domElement.addEventListener('mousedown', (e) => {
                            isDragging = true;
                            previousMousePosition = { x: e.clientX, y: e.clientY };
                        });
                        
                        this.domElement.addEventListener('mousemove', (e) => {
                            if (!isDragging) return;
                            const deltaX = e.clientX - previousMousePosition.x;
                            const deltaY = e.clientY - previousMousePosition.y;
                            
                            const spherical = new THREE.Spherical();
                            spherical.setFromVector3(this.camera.position);
                            spherical.theta -= deltaX * 0.01;
                            spherical.phi += deltaY * 0.01;
                            spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
                            
                            this.camera.position.setFromSpherical(spherical);
                            this.camera.lookAt(0, 0, 0);
                            
                            previousMousePosition = { x: e.clientX, y: e.clientY };
                        });
                        
                        this.domElement.addEventListener('mouseup', () => {
                            isDragging = false;
                        });
                        
                        this.domElement.addEventListener('wheel', (e) => {
                            const distance = this.camera.position.length();
                            const newDistance = distance + e.deltaY * 0.1;
                            this.camera.position.normalize().multiplyScalar(Math.max(this.minDistance, Math.min(this.maxDistance, newDistance)));
                        });
                        
                        this.update = () => {
                            if (this.enableDamping) {
                                this.camera.position.lerp(this.camera.position.clone(), 1 - this.dampingFactor);
                            }
                        };
                        
                        this.reset = () => {
                            this.camera.position.set(0, 0, 500);
                            this.camera.lookAt(0, 0, 0);
                        };
                    }
                };
            }
            
            return true;
        }
        
        // Функция для ожидания загрузки библиотек
        function waitForLibraries(maxAttempts = 20, delay = 100) {
            return new Promise((resolve, reject) => {
                let attempts = 0;
                const check = () => {
                    attempts++;
                    const checks = {
                        'Three.js': typeof THREE !== 'undefined',
                        'D3.js': typeof d3 !== 'undefined'
                    };
                    
                    const logMsg = `Попытка ${attempts}/${maxAttempts}: Three.js=${checks['Three.js']}, D3.js=${checks['D3.js']}`;
                    console.log(logMsg);
                    addLog(logMsg, 'info');
                    
                    if (checks['Three.js'] && checks['D3.js']) {
                        console.log('✅ Все библиотеки загружены!');
                        addLog('✅ Все библиотеки загружены!', 'success');
                        resolve(true);
                    } else if (attempts >= maxAttempts) {
                        reject(new Error('Библиотеки не загрузились за отведенное время'));
                    } else {
                        setTimeout(check, delay);
                    }
                };
                check();
            });
        }
        
        // Ожидание загрузки всех скриптов
        window.addEventListener('load', function() {
            console.log('📦 Ожидание загрузки библиотек...');
            addLog('📦 Ожидание загрузки библиотек...', 'info');
            waitForLibraries()
                .then(() => {
                    if (checkLibraries()) {
                        // Запуск инициализации после загрузки всех скриптов
                        if (typeof init !== 'undefined') {
                            addLog('🚀 Запуск инициализации визуализации...', 'info');
                            init().catch(err => {
                                console.error('❌ Ошибка инициализации визуализации:', err);
                                addLog('❌ Ошибка инициализации: ' + err.message, 'error');
                                document.getElementById('loading').textContent = '❌ Ошибка инициализации: ' + err.message;
                            });
                        } else {
                            console.error('❌ Функция init не найдена');
                            addLog('❌ Ошибка: функция init не найдена', 'error');
                            document.getElementById('loading').textContent = '❌ Ошибка: функция init не найдена';
                        }
                    }
                })
                .catch(err => {
                    console.error('❌ Ошибка загрузки библиотек:', err);
                    addLog('❌ Ошибка загрузки библиотек: ' + err.message, 'error');
                    document.getElementById('loading').textContent = '❌ Ошибка: ' + err.message + '. Обновите страницу (Cmd+Shift+R).';
                });
        });
        
        // Обработка ошибок загрузки скриптов
        window.addEventListener('error', function(e) {
            console.error('❌ Ошибка загрузки скрипта:', e);
            addLog('❌ Ошибка загрузки скрипта: ' + (e.target && e.target.tagName === 'SCRIPT' ? e.target.src : e.message), 'error');
            if (e.target && e.target.tagName === 'SCRIPT') {
                document.getElementById('loading').textContent = '❌ Ошибка загрузки скрипта: ' + (e.target.src || e.message);
            }
        }, true);
        
        // Функция для добавления лога в панель (определяем ПЕРЕД перехватом console)
        function addLog(message, type = 'info') {
            const logContent = document.getElementById('log-content');
            if (!logContent) return;
            
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = message;
            logContent.appendChild(entry);
            
            // Ограничение количества логов (последние 100)
            while (logContent.children.length > 100) {
                logContent.removeChild(logContent.firstChild);
            }
            
            // Автопрокрутка вниз
            logContent.scrollTop = logContent.scrollHeight;
        }
        
        // Функция для переключения панели логов
        function toggleLogPanel() {
            const logPanel = document.getElementById('log-panel');
            if (logPanel) {
                logPanel.style.display = logPanel.style.display === 'none' ? 'block' : 'none';
            }
        }

        // Свернуть/развернуть левую инфо-панель (чтобы не закрывала граф)
        function toggleInfoPanel() {
            const panel = document.getElementById('info-panel');
            if (!panel) return;
            panel.classList.toggle('collapsed');
            const btn = panel.querySelector('.panel-actions button');
            if (btn) btn.textContent = panel.classList.contains('collapsed') ? '🗂 Развернуть' : '🗂 Свернуть';
        }
        
        // Перехват console.log для отображения в панели логов
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        const originalInfo = console.info;
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addLog(args.join(' '), 'info');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addLog(args.join(' '), 'error');
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addLog(args.join(' '), 'warn');
        };
        
        console.info = function(...args) {
            originalInfo.apply(console, args);
            addLog(args.join(' '), 'info');
        };
        
        // Добавляем инструкции для Safari (после определения addLog)
        setTimeout(() => {
            addLog('💡 Для Safari: Cmd+Option+I или меню Разработка → Показать веб-инспектор', 'info');
            addLog('📋 Логи также отображаются в этой панели', 'info');
        }, 100);
    </script>
    <script src="/static/js/three-d3-graph.js"></script>
</body>
