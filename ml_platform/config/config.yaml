# Конфигурация платформы нейросетевых вычислений

training:
  default_epochs: 100
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 10
  min_accuracy_threshold: 0.7
  save_best_only: true
  optimizer: adam  # adam, sgd
  loss_function: cross_entropy  # cross_entropy, mse

gpu:
  min_memory_gb: 2.0
  auto_clear_cache: true
  fallback_to_cpu: true

data:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  normalize: true
  supported_formats:
    - csv
    - parquet
    - hdf5
    - pkl

paths:
  models_dir: /home/user/projects/models
  logs_dir: /var/log/ml_platform
  data_dir: /home/user/projects/data

logging:
  level: INFO
  use_journald: true
  log_file: /var/log/ml_platform/training.log

api:
  host: 0.0.0.0
  port: 8000
  workers: 4

monitoring:
  prometheus_enabled: true
  prometheus_port: 9090
  metrics_path: /metrics

profiles:
  fast_training:
    training:
      default_epochs: 20
      batch_size: 64
      learning_rate: 0.01
    gpu:
      min_memory_gb: 1.0
  
  high_accuracy:
    training:
      default_epochs: 200
      batch_size: 16
      learning_rate: 0.0001
      early_stopping_patience: 20
    gpu:
      min_memory_gb: 4.0
